# 每天访问一次 Supabase，防止免费项目因 7 天无访问被暂停。
# 需要在仓库 Settings → Secrets and variables → Actions 里添加 SUPABASE_URL 和 SUPABASE_ANON_KEY。
name: keep supabase awake
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "secrets not set yet, skipping"; exit 0; fi
          curl -fsS "$URL/rest/v1/trips?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "ok"
