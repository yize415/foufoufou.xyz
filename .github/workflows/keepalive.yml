# 每天访问一次 Supabase，防止免费项目因 7 天无访问被暂停。
# 用的是网页里本来就公开的 publishable key（和 config.js 一致），不涉及任何秘密。
name: keep supabase awake
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        env:
          URL: https://pvkchonoeuceuyypoctg.supabase.co
          KEY: sb_publishable_PbYLTNislCz-p96Y_WqHng_22CYR_pA
        run: |
          curl -fsS "$URL/rest/v1/trips?select=id&limit=1" -H "apikey: $KEY" > /dev/null
          echo "ok"
